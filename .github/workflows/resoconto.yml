name: Resoconto Settimanale VIRTUS
on:
  schedule:
    - cron: '0 7 * * 0'  # Ogni domenica alle 7:00 UTC (9:00 ora italiana)
  workflow_dispatch:      # Permette di eseguirlo manualmente

jobs:
  invia-resoconto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @supabase/supabase-js resend ws
      - run: node .github/scripts/resoconto.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

